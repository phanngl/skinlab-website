name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@latest
      - run: npm install
      # TODO(owner): set BASE_PATH to "/<repo>/" for a project page
      # (e.g. https://<user>.github.io/skinlab/), or "/" for a custom domain
      # or user/org page (https://<user>.github.io/). Must match the path
      # GitHub Pages serves the site from.
      - run: BASE_PATH=/skinlab-website/ npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
